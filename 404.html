<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Pedro Vieira</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilo.css">
  <style>
    .erro { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    .erro > div { display: grid; justify-items: center; gap: 18px; }
    .erro h1 { font: 700 clamp(2rem, 7vw, 3.6rem)/1.1 var(--fonte-display); letter-spacing: -0.04em; text-wrap: balance; }
    .erro p:not(.eyebrow-mono) { color: var(--nevoa); margin-bottom: 10px; }
  </style>
</head>
<body>
  <main class="erro">
    <div>
      <p class="eyebrow-mono">// erro 404</p>
      <h1>Sem energia neste trecho</h1>
      <p>A página que você procurou não existe ou mudou de endereço.</p>
      <a class="btn btn--corrente" href="/">Voltar para o início</a>
    </div>
  </main>
</body>
</html>
